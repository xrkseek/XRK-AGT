name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-fast:
    runs-on: ubuntu-latest
    # test:coverage = 跑一遍 fast（unit+integration）并对 13 个纯逻辑模块做行覆盖门禁，
    # 与 test:fast 跑的是同一批文件，故只跑它一次，不再叠一遍 test:fast。
    # 本机实测 test:coverage 约 12 s，超时主要留给 pnpm install + build。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 版本以 package.json#packageManager 为准，勿再写 version（会与 action-setup 冲突）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install
        run: pnpm install
      # 测试走编译产物：tests/helpers/bootstrap.mjs 硬依赖 dist/src/bootstrap-globals.js，
      # 而下面的 typecheck 是 --noEmit，不产出 dist。缺这一步 → 依赖 dist 的测试整片红
      # （151 tests / 64 fail / 覆盖率报告近乎空白），且症状伪装成「覆盖率不达标」。
      - name: Build（测试 import dist/ 产物，必须先编译）
        run: pnpm build
      - name: Typecheck（全项目类型检查，tsc 语法+类型）
        run: pnpm typecheck
      - name: ESLint 门禁
        run: pnpm lint:gate
      # 门禁只对框架自身（src/ + app/start/debug）生效：core/ 的 express handler
      # req/app 与回调占位参数位置必需，属约定豁免。自测先行，防门禁本身被改坏。
      - name: 未使用声明门禁
        run: |
          pnpm lint:unused:self-test
          pnpm lint:unused
      - name: Test (fast) + 覆盖率门禁
        run: pnpm test:coverage
