# ============================================
# AI 工作流配置（随端口变化）
# ============================================
# 每个 HTTP 端口独立一份。控制工作流开关、LLM/ASR/TTS 厂商、MCP、子服务端等。
# 位置：data/server_bots/{port}/ai-workflow.yaml
# 包含：工作流开关与目录、全局超时、缓存、LLM/ASR/TTS 厂商选择、MCP、Python 子服务端。

# ----------------------------------------
# 工作流系统
# ----------------------------------------
enabled: true

# ----------------------------------------
# 工作流全局
# ----------------------------------------
global:
  debug: false

# ----------------------------------------
# LLM 厂商
# ----------------------------------------
# 填写各工厂 providers[] 条目的 key（先在 data/server_bots/{port}/*_llm.yaml 配置端点）
llm:
  Provider: ""
  # 非流式 callAI 固定走 @xrkseek/harness（见 docs/harness-module-loop.md）
  timeout: 360000      # 请求超时（毫秒）
  retry:
    enabled: true
    # AGT maxAttempts = 含首次；映射为 harness llmRetry.maxRetries = maxAttempts - 1
    maxAttempts: 3
    delay: 2000        # → harness initialDelayMs
    # → harness retryableCodes（timeout/network/5xx/rate_limit/empty/all）
    retryOn: ["timeout", "network", "5xx", "rate_limit", "empty"]
  # Provider 提示缓存：提高前缀命中率、降低 input token 费用（OpenAI / Anthropic / DeepSeek 等）
  promptCache:
    enabled: true
    keyPrefix: xrk
    retention: in-memory
    anthropicCache: true
    scopeInKey: true

# ----------------------------------------
# ASR 厂商
# ----------------------------------------
# 详细配置见 data/server_bots/{port}/volcengine_asr.yaml
asr:
  Provider: volcengine

# ----------------------------------------
# TTS 厂商
# ----------------------------------------
# 详细配置见 data/server_bots/{port}/volcengine_tts.yaml。onlyForASR：true 表示仅 ASR 触发时才 TTS
tts:
  Provider: volcengine
  onlyForASR: true

# ----------------------------------------
# MCP 服务
# ----------------------------------------
# Model Context Protocol：工具调用与跨平台集成。remote 可桥接外部 MCP（stdio/HTTP/SSE/WebSocket）。
mcp:
  enabled: true
  remote:
    enabled: false
    # 用户自增远程 MCP（数组模式）。开放域检索内置 web.web_search（parallel-free 零配置）
    mcpServers: []
  # 控制台 / v1 工具面：仅请求体 workflow.workflows（含 remote-mcp.*）

# Agent 文件工作区（tools / desktop MCP 的 cwd，以及控制台工作区预设）
workspace:
  defaultId: default       # data/ai-workspace/{id}；控制台默认选中
  audit:
    enabled: true
    maxEntries: 200

# Agent 工作区上下文（data/ai-workspace/{id} 内 AGENTS/SOUL/USER/memory + agents/rules|.xrk/skills → system prompt）
# 根目录 AGENTS.md 仅 IDE；agents/workspace/ 仅为首次引导模板，运行时不从项目根 inject standing
agentWorkspace:
  enabled: true
  root: ""                 # 留空=data/ai-workspace/{workspace.defaultId}；请求 workspace 会覆盖
  # 留空=全部；否则仅注入列出的入口：工作流 name（chat/web/desktop/tools…）+ v3（POST /api/v3/chat/completions）
  workflows: []
  includeRules: true
  includeAgentMd: true
  includeSubagents: true
  includeMicroagents: true   # OpenHands：frontmatter triggers 命中则整段注入
  includeDiagnostics: false   # true 时在缺失 MEMORY.md 时追加简短诊断提示
  # 0 = 不限制 prose 总长；Skills 仍受 maxSkillsPromptChars 约束
  maxTotalChars: 0
  maxDiagnosticsChars: 2000   # 诊断提示最大字符
  contextFiles: []         # 额外注入的 Markdown 路径（相对工作区根）
  # Skills 预算与目录结构（formatSkillsForPrompt）
  maxCandidatesPerRoot: 300
  maxSkillsLoadedPerSource: 200
  maxSkillsInPrompt: 60      # 目录卡条数；细则仍靠 tools.read，避免技能名刷屏
  maxSkillsPromptChars: 18000
  maxSkillFileBytes: 256000
  customSkillRoots:
    - ".xrk/skills/core"  # agent-core / tools / core-dev / skillhub / build-skill / memory…
    - ".xrk/skills"       # office-* 等；工作区 data/ai-workspace/{id}/skills 另自动并入
  # 另自动合并 data/ai-workspace/{id}/skills（种子缺啥补啥；托管覆盖见 #skills更新）
  maxRulesChars: 12000
  maxAgentMdChars: 12000
  maxSubagentsChars: 4000    # agents/subagents.yaml 注入预算（OpenCode 式 mode/when/skills 清单）
  maxMicroagents: 5          # 单轮最多激活的 triggers microagent 数
  maxMicroagentsChars: 8000  # microagent 注入总字符上限

# 运行时策略（opencode Policy；最后匹配生效；空=全部允许）
# action: provider.use | tool.call | mcp.connect
# effect: allow | deny | ask（ask：工具仍会出现在列表，执行时见 security.approval；未开审批则拒绝）
# resource: 支持 * / ? 通配；mcp.connect 的 resource=远程 MCP 服务器名
policies: []
# 示例：
# policies:
#   - { effect: deny, action: provider.use, resource: "*" }
#   - { effect: allow, action: provider.use, resource: "anthropic*" }
#   - { effect: deny, action: tool.call, resource: "run" }
#   - { effect: deny, action: mcp.connect, resource: "untrusted*" }

# ----------------------------------------
# 安全：威胁扫描 + 危险指令审批（MCP 执行前）
# ----------------------------------------
# toolScan：goose 式危险命令模式（curl|bash、删盘等）。enabled 默认开。
# approval：仅针对「危险/ask」场景的主人交互审批；默认关闭，不影响日常工具。
#   - enabled=false（默认）：ask → 直接拒绝（主人本人调用且 masterBypassAsk 仍可放行）
#   - enabled=true：私聊主人；回复 #批准 / #批准<编号> / #批准 <编号>（空格可选）；#拒绝 同理
#   - 仅一条待批时可只发 #批准
security:
  toolScan:
    enabled: true            # 是否扫描工具参数（重点 command/cmd/script 等）
    onCritical: deny         # critical：deny | ask
    onHigh: ask              # high：deny | ask | allow（未开 approval 时 ask=拒绝；主人可旁路）
    onMedium: allow          # medium：deny | ask | allow
    # 默认只扫这些键，避免 write/apply_edit 正文里的示例代码误拦
    argKeys: [command, cmd, script, code, shell, powershell]
    scanFullArgs: false      # true=再附带整份 args JSON 截断扫描（更严、易误报）
    masterBypassAsk: true    # 调用者 e.isMaster 时对 ask 直接放行（仍打日志）
  approval:
    enabled: false           # 默认关。true=危险 ask 时私聊主人等批；关则 ask=拒绝
    timeoutMs: 180000        # 等待批准超时（毫秒）；超时按拒绝

# ----------------------------------------
# 配方 Recipes（goose）
# ----------------------------------------
# 文件：agents/recipes/*.yaml（及工作区 recipes/）
# 斜杠：/recipes 列表；/recipe <id> [k=v] 注入 instructions+prompt
recipes:
  scheduleEnabled: false     # true=注册配方内 cron 字段（recipe-schedule 插件；默认仅打日志）

# 上下文增强（历史字段名 embedding；现行为关键词打分召回，非向量）
# AiWorkflowLoader.applyEmbeddingConfig 合并到各工作流 embeddingConfig
embedding:
  enabled: true
  maxContexts: 5

# 上下文策略（出站 token 裁剪用 Provider contextWindow；多轮压缩由 @xrkseek/harness）
context:
  # 群聊/设备历史注入笔录（chat.mergeMessageHistory）
  chatHistory:
    limit: 20                # 普通触发：最近笔录
    globalLimit: 10          # 闲聊旁观：更短，少抢窗、少串台
    keepFirst: 2             # 保留最早任务锚点 + 尾部凑满 limit

# crawl：web_fetch / web_search / browser（browser 启动参数另合并 renderer/playwright）
crawl:
  webFetch:
    timeoutSeconds: 30
    cacheTtlMinutes: 15
    maxChars: 50000
    maxResponseBytes: 2000000
    maxRedirects: 3
    pinDns: true
    readabilityEnabled: true
    userAgent: ""
    firecrawlApiKey: ""
    firecrawlBaseUrl: "https://api.firecrawl.dev"
    firecrawlEnabled: false
  webSearch:
    enabled: true
    provider: ""
    timeoutSeconds: 20
    cacheTtlMinutes: 15
    region: ""
    safeSearch: moderate
    country: ""
    parallelFree:
      url: "https://search.parallel.ai/mcp"
    brave:
      apiKey: ""
      baseUrl: ""
    perplexity:
      apiKey: ""
      openRouterApiKey: ""
      baseUrl: ""
      model: ""
    exa:
      apiKey: ""
      baseUrl: ""
    tavily:
      apiKey: ""
      baseUrl: ""
    parallel:
      apiKey: ""
      baseUrl: ""
    gemini:
      apiKey: ""
      baseUrl: ""
      model: ""
    kimi:
      apiKey: ""
      baseUrl: ""
      model: ""
    minimax:
      apiKey: ""
      baseUrl: ""
      region: ""
      apiHost: ""
    firecrawl:
      apiKey: ""
      baseUrl: ""
    searxng:
      baseUrl: ""
      categories: ""
      language: ""
    ollama:
      baseUrl: "http://127.0.0.1:11434"
      apiKey: ""
      cloudApiKey: ""
  browser:
    browserType: chromium
    headless: true
    wsEndpoint: ""
    executablePath: ""
    launchTimeoutMs: 120000
    navigationTimeoutMs: 60000
    maxTextChars: 50000
    screenshotMaxBytes: 4194304
    screenshotFontDir: ""
    screenshotFontUrlBase: ""
    screenshotFontFiles: []
    ssrfPolicy:
      allowPrivateNetwork: false
      dangerouslyAllowPrivateNetwork: false

# 工具子系统（与 system.js ai-workflow.schema.fields.tools 一一对应）
tools:
  # tools 工作流：文件/命令工作区（core/system-Core/workflow/tools.js）
  file:
    workspace: ""              # 空=data/ai-workspace/{workspace.defaultId}；agent:xxx；project；~/；绝对/相对路径
    maxReadChars: 120000       # 单次 read 上限；过大易一次灌爆窗口，需要再分段读
    grepMaxResults: 80
    runEnabled: true           # 默认允许 shell run / verify；危险命令仍经 security.toolScan；开启后 loopback 强制 API Key
    runTimeoutMs: 120000
    maxCommandOutputChars: 80000

# 多语言子服务端（CommonConfig → AiWorkflow → 子服务端）
subserver:
  default: pyserver
  timeout: 30000
  runtimes:
    pyserver:  { enabled: true, host: "127.0.0.1", port: 8000 }
    goserver:  { enabled: true, host: "127.0.0.1", port: 8001 }
    phpserver: { enabled: true, host: "127.0.0.1", port: 8002 }
    jserver:   { enabled: true, host: "127.0.0.1", port: 8003 }
    netserver: { enabled: true, host: "127.0.0.1", port: 8004 }
    rustserver: { enabled: true, host: "127.0.0.1", port: 8005 }
