# ============================================
# 火山引擎 ASR 配置（随端口变化）
# ============================================
# 豆包语音识别（ASR），大模型异步接口。
# 位置：data/server_bots/{port}/volcengine_asr.yaml

# ----------------------------------------
# WebSocket 连接配置
# ----------------------------------------
# WebSocket连接地址（推荐 bigmodel_async；另有 bigmodel / bigmodel_nostream）
wsUrl: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async"
# 新控制台 API Key（优先；填了则走 X-Api-Key）
apiKey: ""
# 旧控制台 APP ID + Access Token
appKey: ""
accessKey: ""
# 资源ID：1.0=volc.bigasr.sauc.duration；2.0 新建应用用 volc.seedasr.sauc.duration
resourceId: "volc.bigasr.sauc.duration"

# ----------------------------------------
# 音频默认参数（可按会话覆盖）
# ----------------------------------------
# 默认音频格式（pcm 等）
format: "pcm"
# 默认音频编码（raw 等）
codec: "raw"
# 默认采样率（Hz）
sampleRate: 16000
# 默认采样位数
bits: 16
# 默认声道数
channel: 1
# 默认模型名称（对应 request.model_name）
modelName: "bigmodel"

# ----------------------------------------
# 功能开关配置
# ----------------------------------------
# 是否启用逆文本标准化（ITN）
enableItn: true
# 是否启用标点符号
enablePunc: true
# 是否启用说话人分离（DDC）
enableDdc: false
# 是否显示话语
showUtterances: true
# 是否启用加速文本
enableAccelerateText: true

# ----------------------------------------
# 结果类型配置
# ----------------------------------------
# 结果类型：full（完整结果）
resultType: "full"

# ----------------------------------------
# 参数配置
# ----------------------------------------
# 加速分数
accelerateScore: 15
# 是否持久化WebSocket连接
persistentWs: true
# 空闲关闭时间（毫秒）
idleCloseMs: 6000
# 结束窗口大小
endWindowSize: 350
# 强制转语音时间（毫秒）
forceToSpeechTime: 500
# 最大音频缓冲区大小（秒）
maxAudioBufferSize: 30
# ASR最终文本等待时间（毫秒）
asrFinalTextWaitMs: 1200

# ----------------------------------------
# WebSocket 连接保活 / 重连参数（高级）
# ----------------------------------------
# Ping 间隔（0 表示不启用）
wsPingIntervalMs: 30000
# Pong 超时
wsPongTimeoutMs: 10000
# 重连基础延迟（会按次数线性增加）
wsReconnectDelayMs: 2000
# 最大重连次数
wsMaxReconnectAttempts: 5
